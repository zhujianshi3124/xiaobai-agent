# xiaobai-agent bundle 补丁（0.2.0 bundles 通道；debt-039-a 施工笔，EXE-BOOT-045）。
# 与 cordis.patch.yml（部署期模板）的差异＝本文件**零占位符**：装载器 boot 期直读本包、
# 无部署填空位，故模板的两处机器路径在此改走各自缺省语义——
#   agent-memory dataRoot 缺席 ⇒ 插件缺省 <主目录>/.agent-memory
#   （lib/agent-memory/lib/paths.js：显式 > env AGENT_MEMORY_ROOT > 缺省；部署期想改根走模板通道）；
#   toolkit-manager 面板行＝包名+子路径导出形态（'xiaobai-agent/panel'，对 web-all 家族行同款：
#   name=本包 exports "./panel" 子路径，由 bundle 层解析，零绝对路径）。
# compact-router 不在此（与模板同理：预设托管，走 scripts/apply-preset-patch.mjs 通道）。
- id: web
  config:
    searchProvider: auto-search

- id: web-search-deepseek
  disabled: false

- insert:
    - id: rate-throttle
      name: 'xiaobai-agent/rate-throttle'
      config:
        enabled: false
        throttleProviders: []
        minIntervalMs: 3000
        maxRequestsPerMinute: 6
        adaptive: false
        maxIntervalMs: 20000
        backoffFactor: 2
        logProviders: []
        logPath: ''
        routing:
          enabled: true
          autoGroups: true
          autoGroupTtlMs: 300000
          excludeProviders: [llm-deepseek, deepseek-official]
          cooldownMs: 300000
          tpmTurnSkip: true
          tpmCooldownMs: 45000
          downgradeContextMargin: 0.9
          maxDowngradeCompactsPerTurn: 1
          metricsWindowMs: 600000
          metricsLogIntervalMs: 60000
          clearCooldownOnUserSwitch: true
          syncSelectionOnFailover: true
          staticGroups:
            - id: example-group-a
              providers:
                - { provider: example-provider-a, model: example-model-a }
                - { provider: example-provider-b, model: example-model-a }
                - { provider: example-provider-c, model: example-model-a }
                - { provider: example-provider-d, model: example-model-a }
                - { provider: example-provider-e, model: example-model-a }
            - id: example-group-b
              providers:
                - { provider: example-provider-f, model: example-model-b }
                - { provider: example-provider-g, model: example-model-b }
                - { provider: example-provider-h, model: example-model-b }
                - { provider: example-provider-i, model: example-model-b }
                - { provider: example-provider-j, model: example-model-b }
                - { provider: example-provider-k, model: example-model-b }
      inject: [llm, tokenMeter]

- insert:
    - id: web-search-router
      name: 'xiaobai-agent/search-router'
      config:
        mode: auto
        officialProviders: [llm-deepseek]
        officialProviderPatterns: []
        officialModelPatterns: []
        defaultWhenUnknown: local
      inject: [web]

- insert:
    - id: agent-memory-runtime
      name: 'xiaobai-agent/agent-memory/plugin'
      config:
        defaultWorkspace: null
      inject: [systemPrompt]

- insert:
    - id: toolkit-manager
      name: 'xiaobai-agent/panel'
