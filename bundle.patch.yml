# xiaobai-agent bundle 补丁（0.2.0 bundles 通道；debt-039-a 施工笔，EXE-BOOT-045）。
# 与 cordis.patch.yml（部署期模板）的差异＝本文件**零占位符**：装载器 boot 期直读本包、
# 无部署填空位，故模板的两处机器路径在此改走各自缺省语义——
#   agent-memory dataRoot 缺席 ⇒ 插件缺省 <主目录>/.agent-memory
#   （lib/agent-memory/lib/paths.js：显式 > env AGENT_MEMORY_ROOT > 缺省；部署期想改根走模板通道）；
#   toolkit-manager 面板行＝包名+子路径导出形态（'xiaobai-agent/panel'，对 web-all 家族行同款：
#   name=本包 exports "./panel" 子路径，由 bundle 层解析，零绝对路径）。
# compact-router 不在此（与模板同理：预设托管，走 scripts/apply-preset-patch.mjs 通道）。
- id: web
  config:
    searchProvider: auto-search

- id: web-search-deepseek
  disabled: false

- insert:
    - id: toolkit-manager
      name: 'xiaobai-agent/panel'
