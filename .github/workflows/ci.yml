# 结构就位，但**本环境从未执行过**（债务 #5 的如实申报）：
#   ① 本仓没有 git 远端（`git remote -v` 空）——这个文件今天不会在任何地方跑起来；
#   ② 门禁依赖 DOCTOR_CLI 变量注入本机 doctor CLI 绝对路径（仓级文件面检查的 CLI 按裁决
#      留在独立仓）；@deepseek-ai/* 依赖自 S2 正名批（G8）起全部经公共 registry 解析
#      （lock 全 resolved、npm ci 实证可复装）——历史"私有源"陈述已过时废止；
#   ③ 门禁正本 = 本机 `node scripts/ci-local.mjs`（build×3 + pluggable-lint +
#      no-subplugin-import-check + typecheck×3 + node --test + 回归全跑 + doctor dry-run 0/0/0）。
# 若将来接入远端：在 runner 侧注入 DOCTOR_CLI，并按需补 S5 真浏览器用例。
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    # 必须是能注入本机 doctor CLI 路径（DOCTOR_CLI）的 self-hosted runner
    runs-on: [self-hosted, dsh]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (engines: >=22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (public registry, lock fully resolved)
        run: npm ci

      - name: Full local gate (build×3 + lint + import-guard + typecheck×3 + tests + regression + doctor 0/0/0)
        run: node scripts/ci-local.mjs --with-scan
        env:
          # 仓级文件面检查的 CLI 按裁决留在独立仓；嵌入别机时用该变量注入
          DOCTOR_CLI: ${{ vars.DOCTOR_CLI }}
