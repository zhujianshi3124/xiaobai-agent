<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-toolkit 面板（插件开关与体检）</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; padding: 20px; background: #111318; color: #e6e6e6; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 16px 0 8px; }
  .muted { color: #9aa0a6; font-size: 12px; }
  .toolbar { display: flex; gap: 8px; margin: 16px 0; align-items: center; flex-wrap: wrap; }
  button { padding: 6px 14px; border-radius: 6px; border: 1px solid #3a3f47; background: #1c2027; color: #e6e6e6; cursor: pointer; font-size: 13px; }
  button:hover { border-color: #5a8dee; }
  button[disabled] { opacity: 0.6; cursor: default; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card { border: 1px solid #2a2f36; border-radius: 8px; padding: 12px; background: #181b21; }
  .card h3 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-family: ui-monospace, Consolas, monospace; }
  .subtitle { font-size: 12.5px; color: #9aa0a6; margin: 0 0 8px; }
  .desc { font-size: 13px; line-height: 1.55; margin: 0 0 10px; color: #d7dae0; }
  .stateRow { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; }
  .dot.on { background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,0.18); }
  .dot.warn { background: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,0.18); }
  .dot.off { background: #8b9099; }
  .state.on { color: #4ade80; }
  .state.warn { color: #fbbf24; }
  .state.off { color: #9aa0a6; }
  .dualBox { margin: 0 0 10px; padding: 8px 10px; border-radius: 6px; background: #2a2210; border: 1px solid #6b5a1e; }
  .dualHead { color: #fbbf24; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .dualLine { font-size: 12px; color: #e0d5b7; line-height: 1.6; }
  .dualCode { font-family: ui-monospace, Consolas, monospace; color: #f0e2b8; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; }
  .derived { background: #3a2b17; color: #e8c36c; }
  .local { background: #211f3a; color: #9c96db; }
  details { margin-top: 10px; border-top: 1px solid #23272d; padding-top: 8px; }
  summary { cursor: pointer; font-size: 12px; color: #8ab4f8; user-select: none; }
  .techRow { font-size: 11.5px; color: #9aa0a6; font-family: ui-monospace, Consolas, monospace; line-height: 1.7; word-break: break-all; }
  .techKey { color: #7f858d; }
  /* ---- P2.2 启停开关（双层分立）---- */
  .toggleBox { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: #151922; border: 1px solid #2a2f36; }
  .toggleHead { font-size: 12px; font-weight: 700; color: #c8cdd4; margin-bottom: 6px; }
  .layerRow { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; line-height: 1.9; margin-bottom: 2px; }
  .layerLabel { color: #8f959d; font-family: ui-monospace, Consolas, monospace; }
  .layerValue { font-weight: 600; }
  .toggleRow { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .confirmBox { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: #1b2028; border: 1px solid #3a4048; }
  .confirmHead { font-size: 12px; font-weight: 700; color: #cfd4da; margin-bottom: 6px; }
  .confirmLine { font-size: 11.5px; color: #9aa0a6; line-height: 1.8; word-break: break-all; }
  .confirmRow { display: flex; gap: 8px; margin-top: 8px; }
  .diffPre { white-space: pre-wrap; background: #12151a; border: 1px solid #2a2f36; border-radius: 4px; padding: 6px 8px; font-size: 11.5px; margin: 6px 0; font-family: ui-monospace, Consolas, monospace; }
  .crossBox { margin-top: 6px; padding: 6px 8px; border-radius: 4px; background: #2a2210; border: 1px solid #6b5a1e; }
  .crossHead { font-size: 11.5px; font-weight: 700; color: #fbbf24; margin-bottom: 3px; }
  .crossLine { font-size: 11px; color: #e0d5b7; font-family: ui-monospace, Consolas, monospace; line-height: 1.7; word-break: break-all; }
  .crossFoot { font-size: 11px; color: #c9bd9a; margin-top: 3px; }
  .errBox { margin-top: 6px; padding: 6px 8px; border-radius: 4px; background: #2b1719; border: 1px solid #6b2226; font-size: 11.5px; color: #f2a6a0; }
  /* 确认页：生效时机说明 + 字段人话解释 */
  .confirmEffect { font-size: 12px; font-weight: 600; color: #fbbf24; line-height: 1.7; margin-bottom: 4px; }
  .confirmNote { font-size: 11.5px; color: #a9aeb5; line-height: 1.75; margin-top: 4px; }
  .noteCode { font-family: ui-monospace, Consolas, monospace; color: #d9c58a; }
  .condNote { margin-top: 4px; font-size: 11px; color: #e0d5b7; line-height: 1.7; }
  /* ---- P2.3 参数编辑 ---- */
  .cfgBox { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: #141a1c; border: 1px solid #24403a; }
  .cfgHead { font-size: 12px; font-weight: 700; color: #9fd8c0; margin-bottom: 4px; }
  .cfgNote { font-size: 11px; color: #8fa89e; line-height: 1.7; margin-bottom: 6px; }
  /* W2 余件：四卡"改完要重启"提示位（服务端 configPanel.effectNote，与 React 通道同源） */
  .effectNote { font-size: 11px; color: #8fa89e; line-height: 1.7; margin: 0 0 8px; }
  .cfgSection { font-size: 11px; font-weight: 700; color: #7f8f88; margin: 8px 0 2px; font-family: ui-monospace, Consolas, monospace; }
  .cfgRow { display: flex; gap: 6px; align-items: center; font-size: 11.5px; line-height: 2; flex-wrap: wrap; }
  .cfgLabel { color: #a9b3ad; flex: 1 1 200px; font-family: ui-monospace, Consolas, monospace; }
  .cfgCur { color: #6f7a74; font-family: ui-monospace, Consolas, monospace; }
  .cfgInput { width: 110px; padding: 2px 6px; border-radius: 4px; border: 1px solid #2c3c36; background: #101413; color: #d7e2dc; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  .cfgSave { padding: 2px 8px; border-radius: 4px; border: 1px solid #2c5a4a; background: #12241e; color: #9fd8c0; cursor: pointer; font-size: 11px; }
  .modeBox { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: #161a22; border: 1px solid #2a2f36; }
  .modeLine { font-size: 11.5px; color: #a9aeb5; line-height: 1.8; }
  /* ---- P2.4 缺席态（六态）---- */
  .absBox { margin: 0 0 10px; padding: 8px 10px; border-radius: 6px; background: #1a1f27; border: 1px solid #3a3f47; }
  .absBox.warn { background: #2a2210; border-color: #6b5a1e; }
  .absHead { font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #c8cdd4; }
  .absBox.warn .absHead { color: #fbbf24; }
  .absLine { font-size: 12px; color: #d7dae0; line-height: 1.7; }
  /* ---- P2.4 卸载 / 恢复 ---- */
  .uninBox { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: #1d1a1c; border: 1px solid #4a3236; }
  .uninHead { font-size: 12px; font-weight: 700; color: #eba0a0; margin-bottom: 6px; }
  .uninRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .uninOpen { padding: 4px 10px; border-radius: 4px; border: 1px solid #4a4048; background: #221d22; color: #e0cfe0; cursor: pointer; font-size: 12px; }
  .restOpen { padding: 4px 10px; border-radius: 4px; border: 1px solid #2c5a4a; background: #12241e; color: #9fd8c0; cursor: pointer; font-size: 12px; }
  .dlgBox { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: #1b2028; border: 1px solid #4a4048; }
  .dlgTitle { font-size: 12.5px; font-weight: 700; color: #e8d9b0; margin-bottom: 6px; }
  .dlgKey { font-size: 11.5px; font-weight: 700; color: #8f959d; margin-top: 6px; }
  .dlgLine { font-size: 11.5px; color: #cfd4da; line-height: 1.8; }
  .dlgInput { width: 100%; box-sizing: border-box; padding: 3px 6px; border-radius: 4px; border: 1px solid #3a4048; background: #101413; color: #e6e6e6; font-size: 12px; font-family: ui-monospace, Consolas, monospace; margin-top: 3px; }
  .dlgWarn { margin-top: 6px; padding: 6px 8px; border-radius: 4px; background: #2a2210; border: 1px solid #6b5a1e; font-size: 11.5px; color: #e0d5b7; line-height: 1.8; }
  .dlgWarnTop { margin-bottom: 6px; padding: 5px 8px; border-radius: 4px; background: #3a1414; border: 1px solid #8a3030; font-size: 12px; font-weight: 700; color: #f0c0bc; }
  .dlgBold { font-weight: 700; }
  .banner { margin: 12px 0; padding: 10px 12px; border-radius: 6px; background: #12241e; border: 1px solid #2c5a4a; color: #9fd8c0; font-size: 13px; }
  pre { white-space: pre-wrap; background: #12151a; border: 1px solid #2a2f36; border-radius: 6px; padding: 10px; font-size: 12px; max-height: 340px; overflow: auto; }
  .issues { max-height: 320px; overflow: auto; border: 1px solid #2a2f36; border-radius: 6px; }
  .issue { border-bottom: 1px solid #23272d; padding: 8px; font-size: 12px; line-height: 1.6; }
  .error { color: #f28b82; }
  .warning { color: #e8c36c; }
  .info { color: #9aa0a6; }
  .allGood { padding: 12px 10px; font-size: 13px; color: #67c48b; }
</style>
</head>
<body>
  <h1>dsh-toolkit 面板（插件开关与体检）</h1>
  <div class="muted" id="meta"></div>
  <div class="toolbar">
    <button id="refresh">重新读取状态</button>
    <button id="doctor">一键体检（只查不改）</button>
    <span class="muted" id="doctorStatus"></span>
  </div>
  <div id="banner"></div>
  <div id="cards" class="cards"></div>
  <h2>配置文件原文（cordis.patch.yml · 插件开关所在）</h2>
  <pre id="patch"></pre>
<h2>体检与操作台（doctor dry-run · 只查不改＋逐条确认后才执行）</h2>
<div id="doctorOut" class="issues"></div>
<div id="consoleOut"></div>
<script>
// 本页一切请求的唯一基址（P7 嵌入 / REQ-8）：装配时由服务端按 config.servicePrefix 改写
// 该标记（contract.contractHttpBase）；缺省前缀 toolkit 下恰为 /api/toolkit-panel，URL 零变化。
var PANEL_API = "__TOOLKIT_PANEL_API_BASE__";
var state = null;
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

var DESCRIPTIONS = {
  "agent-memory": "记住你说过的话和项目里的重要信息，下次对话还能用上。",
  "compact-router": "对话变长时自动压缩历史内容，省上下文又不断片；压缩方式有自动、LLM 摘要、即时抽取三种，可随时切换。",
  "rate-throttle": "在多个模型服务之间自动换路、出错冷却与降档压缩，避开限额和故障；另有请求限速开关（默认关闭）。",
  "search-router": "决定每次联网搜索走哪条路：官方搜索还是本地搜索。",
  "web-search-local": "提供不依赖官方接口的本地搜索引擎，可自选搜索源。"
};
// 标识符一律「英文原名 + 中文注释」形态：原名是稳定可检索的标识，中文只作注释。
var CN_NAMES = {
  "agent-memory": "记忆",
  "compact-router": "上下文压缩",
  "rate-throttle": "限流",
  "search-router": "搜索路由",
  "web-search-local": "本地网页搜索"
};
// 英文原名：优先用快照里的真实包名尾部，回退到目录名
function originalName(p) {
  var raw = String((p && p.name) || "").trim();
  if (raw) {
    var seg = raw.split("/");
    var last = seg[seg.length - 1];
    if (last) return last;
  }
  return String((p && p.dir) || "");
}
// 「英文原名（中文注释）」单行形态
function annotated(p) {
  var en = originalName(p);
  var cn = CN_NAMES[(p && p.dir) || ""];
  return cn ? en + "（" + cn + "）" : en;
}

function originBadge(p) {
  if (p.origin === "derived") return '<span class="badge derived">第三方衍生 ' + esc(p.upstream) + "</span>";
  return '<span class="badge local">本地原创</span>';
}

// 首选服务端 patchRow.config.enabled —— P2.0 已修 parseRootRows() 的缩进缺陷
// （旧版用不区分缩进的正则收集 config，rate-throttle 自身 enabled:false 会被嵌套
// routing.enabled:true 覆盖成 "true"）。修好后服务端值可信。
// 下面的 rowAnchorFromPatch 仅作防御性回退，避免服务端退回旧解析时误报。
function rowAnchorFromPatch(p, patchText) {
  if (!patchText || !p.patchRow) return null;
  var lines = String(patchText).split(/\r?\n/);
  var wantId = p.patchRow.id;
  var start = -1;
  for (var i = 0; i < lines.length; i++) {
    var m = /^(\s*)- id:\s*([^#\s]+)/.exec(lines[i]);
    if (m && m[2] === wantId) { start = i; break; }
  }
  if (start < 0) return null;
  var cfgIndent = -1;
  for (var j = start + 1; j < lines.length; j++) {
    if (/^(\s*)- id:/.test(lines[j])) break;
    var c = /^(\s+)config:\s*$/.exec(lines[j]);
    if (c) { cfgIndent = c[1].length; break; }
  }
  if (cfgIndent < 0) return null;
  for (var k = start + 1; k < lines.length; k++) {
    if (/^(\s*)- id:/.test(lines[k])) break;
    var kv = /^(\s+)enabled:\s*(\S+)\s*$/.exec(lines[k]);
    if (kv && kv[1].length === cfgIndent + 2) return { value: kv[2] === "true", line: k + 1 };
  }
  return { value: null, line: null };
}
function innerSwitchValue(p, patchText) {
  var row = p.patchRow;
  var cfg = (row && row.config) || {};
  if (row && Object.prototype.hasOwnProperty.call(cfg, "enabled") && typeof cfg.enabled === "string") {
    // 服务端已按缩进解析（P2.0 修复），直接用
    return String(cfg.enabled).trim() === "true";
  }
  // 回退：服务端值缺失时，从 patch 原文按缩进自算
  var exact = rowAnchorFromPatch(p, patchText);
  if (exact) return exact.value;
  return null;
}
// ── F-49 专案（唯一判定点）：rate-throttle 在 config 顶层与 config.routing 下各有一个 enabled ──
// 顶层那枚管主动节流（总装补丁按设计关掉），routing 那枚管路由/冷却/降档 —— 后者才是本插件主功能
// （消费点见 lib/rate-throttle/index.js:656、:781；缺省语义 `routingCfg.enabled !== false` 见 :167）。
// 判据只取服务端已下发的 configPanel.values.routing（值=patch 原文，P2.3 已钉死无遮蔽）。
// 返回 null 表示"这一层面板没读到"，调用方必须退回通用语义 —— 面板不替插件臆断没读到的开关。
// 出现第二家双同名 enabled 的插件时再按 debt.md#31 的边界行泛化，勿在此之外散 if 链。
// ⚠ 与 panel/client/index.js 里的 rateThrottleRoutingOn 是同一判据的两份实现（两渲染器无共享文案源，
//   见 test 里 E 节的双渲染器同判钉子）⇒ 改一处必改两处。
function rateThrottleRoutingOn(p) {
  if (!p || p.dir !== "rate-throttle") return null;
  var routing = ((p.configPanel || {}).values || {}).routing;
  if (!routing || typeof routing !== "object") return null;
  if (!Object.prototype.hasOwnProperty.call(routing, "enabled")) return true;
  var v = String(routing.enabled).trim();
  return v === "true" ? true : (v === "false" ? false : null);
}
var PATCH_TEXT = "";
function stateOf(p) {
  // ---- P2.4 缺席态优先（服务端 status/statusCopy 为权威；不在场就不该再报「运行中」）----
  if (p.status === "dependency-broken") {
    return { label: p.statusCopy || "依赖缺失", cls: "warn" };
  }
  if (p.status && p.status !== "mounted") {
    return { label: p.statusCopy || ABSENCE_COPY_FALLBACK[p.status] || "状态未知", cls: "off" };
  }
  // F-45：只到"本体在 + 预设行已改"这一层判据（status 已在上面拦过缺席态）。
  // 面板不查宿主的加载结果，预设托管的改动更要重启才落地 ⇒ 不写"正在生效"。
  if (p.dir === "compact-router") return { label: "运行中 · 预设托管，预设的改动要重启 DSH 才生效", cls: "on" };
  if (!p.patchRow) return { label: "配置层停用 · 未加载", cls: "off" };
  // Q1：disabled 是条件写法（如 !!js ...）时，实际是否加载取决于该表达式，
  // 面板不解释，因此不能报"运行中"。
  if (p.patchRow.disabledExpr) return { label: "配置层是条件开关 · 实际是否加载取决于该表达式，面板不解释", cls: "warn" };
  if (p.patchRow.enabled !== true) return { label: "配置层停用 · 未加载", cls: "off" };
  var inner = innerSwitchValue(p, PATCH_TEXT);
  // F-49 专案：rate-throttle 的状态以主功能（路由/冷却/降档）为准，主动节流并列说清；
  // 只有两层都关才配得上"暂不生效"。取不到 routing 时 routingOn=null，走下面通用语义。
  var routingOn = rateThrottleRoutingOn(p);
  if (routingOn !== null) {
    var throttleOn = inner !== false;
    if (routingOn && throttleOn) return { label: "运行中 · 路由/冷却/降档与主动节流都开着", cls: "on" };
    if (routingOn) return { label: "运行中 · 路由/冷却/降档开着，主动节流未开", cls: "on" };
    if (throttleOn) return { label: "运行中 · 主动节流开着，路由/冷却/降档未开", cls: "on" };
    return { label: "已加载 · 功能开关关闭，暂不生效", cls: "warn" };
  }
  if (inner === false) return { label: "已加载 · 功能开关关闭，暂不生效", cls: "warn" };
  return { label: "运行中 · 正在生效", cls: "on" };
}
function dualSwitchNotice(p) {
  if (p.patchRow && p.patchRow.enabled === true && innerSwitchValue(p, PATCH_TEXT) === false) {
    // F-49 专案：rate-throttle 主功能（路由）开着时，这一框不能说"所以现在没生效"。
    if (rateThrottleRoutingOn(p) === true) {
      return '<div class="dualBox"><div class="dualHead">⚠ 两个同名的 enabled 各管各的：主功能开着，主动节流没开</div>'
        + '<div class="dualLine">第一层（配置文件）：<span class="dualCode">已启用</span> —— 插件已被加载。<br>'
        + '主动节流（config.enabled）：<span class="dualCode">关闭</span> —— 限速那一档没工作。<br>'
        + '路由/冷却/降档（config.routing.enabled）：<span class="dualCode">开着</span> —— 这才是本插件一直在做的主功能。<br>'
        + '要让它真正工作（这里指主动节流），需要把插件配置里的 <span class="dualCode">enabled</span> 改为 <span class="dualCode">true</span>；改的是配置文件，重启 DSH 后才落地。<br>'
        + '提示：本面板只负责第一层（加载与否）—— 第二层的参数编辑已随 <span class="dualCode">P2.3 配置编辑</span> 上线，见本卡下方<span class="dualCode">「参数编辑」</span>。</div></div>';
    }
    return '<div class="dualBox"><div class="dualHead">⚠ 两层开关不一致，所以现在没生效</div>'
      + '<div class="dualLine">第一层（配置文件）：<span class="dualCode">已启用</span> —— 插件已被加载。<br>'
      + '第二层（插件内部）：<span class="dualCode">关闭</span> —— 功能被自己关掉了。<br>'
      + '要让它真正工作，需要把插件配置里的 <span class="dualCode">enabled</span> 改为 <span class="dualCode">true</span>。<br>'

function wireToggle(cardEl, p) {

function wireConfig(cardEl, p) {
  var box = cardEl.querySelector("[data-cfg-for]");
  if (!box) return;
  var confirmHost = box.querySelector(".cfgConfirm");
  var msg = box.querySelector(".cfgMsg");
  var panel = p.configPanel;
  box.addEventListener("click", async function (ev) {
    var btn = ev.target.closest(".cfgSave");
    if (!btn || btn.disabled) return;
    var path = btn.getAttribute("data-cfg-path");
    var type = btn.getAttribute("data-cfg-type");
    var f = null;
    for (var i = 0; i < CONFIG_FIELDS.length; i++) if (CONFIG_FIELDS[i].path === path) { f = CONFIG_FIELDS[i]; break; }
    if (!f) return;
    var raw;
    if (type === "bool") {
      var cb = box.querySelector('[data-cfg-check="' + path + '"]');
      raw = cb && cb.checked ? "true" : "false";
    } else {
      var inp = box.querySelector('[data-cfg-input="' + path + '"]');
      raw = inp ? inp.value : "";
    }
    var cur = cfgRawValue(p, f);
    if (String(raw).trim() === cur) { msg.innerHTML = '<span class="muted">无改动：已是该值。</span>'; return; }
    btn.disabled = true;
    msg.textContent = "正在生成改动方案…";
    confirmHost.innerHTML = "";
    try {
      var res = await fetch(PANEL_API + "/config/plan", {
        method: "POST", cache: "no-store", headers: { "content-type": "application/json" },
        body: JSON.stringify({ rowId: panel.rowId, path: path, value: raw })
      });

function uninstallDialogHtml(p, mode) {
  var set = UNINSTALL_COPY[p.dir];
  var c = set && set[mode];
  if (!c) return "";
  var isTrue = mode === "true";
  var wd = p.bodyStats || null;
  var inputs = isTrue
    ? '<input class="dlgInput" data-confirm-idx="0" placeholder="' + esc(p.dir) + '">'
      + '<div class="dlgWarn">' + esc(TRUE_COMMON.windowWarning) + "</div>"
      + '<input class="dlgInput" data-confirm-idx="1" placeholder="' + esc(p.dir) + '">'
    : '<input class="dlgInput" data-confirm-idx="0" placeholder="' + esc(p.dir) + '">';
  var html = '<div class="dlgBox" data-uninstall-for="' + esc(p.dir) + '" data-uninstall-mode="' + mode + '">'
    + '<div class="dlgTitle">' + esc(c.title) + "</div>";
  // 两补强 (a)：顶部重复短句
  if (isTrue) html += '<div class="dlgWarnTop">⚠ ' + esc(TRUE_COMMON.topWarning) + "</div>";
  html += '<div class="dlgKey">删什么</div><div class="dlgLine">' + esc(c.del) + "</div>"
    + '<div class="dlgKey">后果（重启后）</div><div class="dlgLine">' + esc(c.consequence) + "</div>";
  // 真卸载三句必含：空窗期警告 / 收据透明句 / 回收站句
  if (isTrue) {
    html += '<div class="dlgKey">不可恢复（空窗期）</div><div class="dlgLine"><span class="dlgBold">' + esc(TRUE_COMMON.windowWarning) + "</span></div>"
      + '<div class="dlgKey">收据（仅对账）</div><div class="dlgLine">' + esc(TRUE_COMMON.receipt) + "</div>"
      + '<div class="dlgKey">回收站</div><div class="dlgLine"><span class="dlgBold">' + esc(TRUE_COMMON.recycleBin) + "</span></div>";
  }
  html += '<div class="dlgKey">生效时间</div><div class="dlgLine">' + esc(c.timing) + "</div>";
  if (!isTrue) {
    html += '<div class="dlgKey">已存档</div><div class="dlgLine"><span class="dlgBold">' + esc(c.archive) + "</span></div>";
  }
  // 两补强 (b)：确认前展示将删文件清单 + 总字节数
  if (isTrue && wd) {
    html += '<div class="dlgKey">将删除</div><div class="dlgLine"><span class="dlgBold">共 ' + wd.files
      + " 个文件，合计 " + wd.bytes + " 字节（清单已记入收据，可事后对账）。</span></div>";
  }
  html += '<div class="dlgKey">恢复路径</div><div class="dlgLine">' + esc(c.restorePath) + "</div>"
    + '<div class="dlgKey">重启</div><div class="dlgLine"><span class="dlgBold">' + esc(isTrue ? TRUE_COMMON.restart : c.restart) + "</span></div>"
    + '<div class="dlgKey">确认操作</div><div class="dlgLine">' + esc(c.confirm) + "</div>";
  // §3.6(a)（判定 2026-09-19）：真卸载可选「删除原因」——位置＝将删清单之后、输名之前，
  // 不挤占两次输名之间的空窗期警告；选填，空 ⇒ 收据如实记「（未填写）」。
  if (isTrue) {
    html += '<div class="dlgKey">删除原因（可不填）</div><div class="dlgLine">' + esc("可以写一句你自己的话，比如「不再需要这个功能」。它会原样写进删除收据，将来帮你想起当时为什么删的。不填也可以，收据会如实记「（未填写）」。") + "</div>"
      + '<input class="dlgInput" data-reason="1" maxlength="200" placeholder="可选：写一句话，最多 200 字">';
  }
  html += inputs
    + '<div class="uninRow"><button class="uninGo" data-mode="' + mode + '">'
    + (isTrue ? "确认彻底删除" : "确认软卸载") + "</button>"
    + '<button class="uninNo">取消</button><span class="muted uninMsg"></span></div></div>';
  return html;
}

// 软卸载恢复确认页（§2.9b，无文件回写）／挂载确认页（重装后，销毁式 v2 §5）
function restoreDialogHtml(p, kind, conflict, choices) {
  var name = p24Name(p);
  var c;
  if (kind === "mount") {
    c = {
      title: "挂载「" + name + "」（重新安装后）",
      body: "将把「" + name + "」的启动入口重新写回挂载面（行块与系统设置项按卸载收据复原）。源代码文件已由你重新安装放回本地，本操作不涉及文件写入。"
    };
  } else {
    c = {
      title: "恢复「" + name + "」（软卸载恢复）",
      body: "将重新打开面板到「" + name + "」的启动入口，源代码文件一直在本地，不涉及文件恢复；若卸载时改动了系统设置项，将一并恢复。"
    };
  }
  var html = '<div class="dlgBox" data-restore-for="' + esc(p.dir) + '" data-restore-kind="' + kind + '">'
    + '<div class="dlgTitle">' + esc(c.title) + "</div>"
    + '<div class="dlgLine">' + esc(c.body) + "</div>";
  // F-73 产品级：软卸载收据块（只读）——行文案由服务端 softReceipt.lines 权威下发，与 React 通道同文；
  // 挂载弹窗（重装后）不属软卸载收据面，不渲染。
  var receipt = kind !== "mount" && p.softReceipt && p.softReceipt.lines && p.softReceipt.lines.length ? p.softReceipt.lines : null;
  if (receipt) {
    html += '<div class="dlgKey">卸载收据（只读）</div>';
    for (var ri = 0; ri < receipt.length; ri++) html += '<div class="dlgLine">' + esc(receipt[ri]) + "</div>";
  }
  if (conflict) {
    var cur = conflict.currentValue === undefined || conflict.currentValue === null ? "" : String(conflict.currentValue);
    var bak = conflict.backupValue === undefined || conflict.backupValue === null ? "" : String(conflict.backupValue);
    var labels = choices && choices.length === 3 ? choices : null;
    html += '<div class="dlgWarn">'
      + "若恢复时发现某项系统设置已被其他程序改掉（当前值是 " + esc(cur) + "，卸载前是 " + esc(bak)
      + "），弹窗三选一：A. 保留当前值（不覆盖）；B. 恢复成卸载前的值；C. 取消本次恢复。面板不会自动覆盖。</div>"
      + '<div class="uninRow">'
      + '<button class="cfA">' + esc(labels ? labels[0].label : "保留当前值（不覆盖）") + "</button>"
      + '<button class="cfB">' + esc(labels ? labels[1].label : "恢复成卸载前的值") + "</button>"
      + '<button class="cfC">' + esc(labels ? labels[2].label : "取消本次恢复") + "</button>"
      + "</div>";
  } else {
    html += '<div class="dlgKey">重启</div><div class="dlgLine"><span class="dlgBold">' + esc("恢复完成后需要重启才生效。") + "</span></div>"
      + '<div class="dlgKey">确认操作</div><div class="dlgLine">' + esc("点「确认恢复」，或点「取消」。") + "</div>"
      + '<div class="uninRow"><button class="restGo">确认恢复</button><button class="restNo">取消</button>'
      + '<span class="muted restMsg"></span></div>';
  }
  return html + "</div>";
}

function p24SectionHtml(p) {
  var status = p.status || "mounted";
  // 三入口各认快照字段（唯一真源）：卸载 / 恢复（**软卸载专有**）/ 挂载（**重装后**，销毁式 v2 §5）。
  var gone = status === "soft-unmounted" || status === "true-uninstalled" || status === "unknown-absent";
  var canUninstall = !gone;
  var canRestore = p.restoreAvailable === true;
  var canMount = p.canMount === true;
  if (!canUninstall && !canRestore && !canMount) return "";
  var html = '<div class="uninBox" data-p24-for="' + esc(p.dir) + '"><div class="uninHead">卸载 / 恢复</div>';
  if (canUninstall) {
    // 销毁式 v2：软 / 真两入口并存。真卸载**不可逆**（弹窗三句必含 + 输入两次）。
    html += '<div class="dlgLine">「软卸载」摘除挂载行、本体保留、可一键恢复；「真卸载」彻底删除本体、不留副本、不可恢复。</div>'
      + '<div class="uninRow">'
      + '<button class="uninOpen" data-mode="soft">软卸载</button>'
      + '<button class="uninOpen" data-mode="true">真卸载</button>'
      + "</div>";
  }
  if (canRestore) html += '<div class="uninRow"><button class="restOpen">恢复</button></div>';
  if (canMount) html += '<div class="uninRow"><button class="mountOpen">挂载（重装后）</button></div>';
  return html + '<div class="p24Dlg"></div><div class="p24Msg"></div></div>';
}

// ---- 接线 ----
function qsa(root, sel) {
  return root && typeof root.querySelectorAll === "function" ? root.querySelectorAll(sel) : [];
}
async function p24Post(url, payload) {
  var res = await fetch(url, { method: "POST", cache: "no-store", headers: { "content-type": "application/json" }, body: JSON.stringify(payload || {}) });
  var body = await res.json();
  return { status: res.status, body: body };
}
async function p24Get(url) {
  var res = await fetch(url, { cache: "no-store" });
  return { status: res.status, body: await res.json() };
}
function p24Banner(text) {
  var host = el("banner");
  if (host) host.innerHTML = '<div class="banner">' + esc(text) + "</div>";
}
function wireP24(cardEl, p) {
  var box = cardEl.querySelector("[data-p24-for]");
  if (!box) return;
  var dlgHost = box.querySelector(".p24Dlg");
  var msg = box.querySelector(".p24Msg");
  if (!dlgHost) return;
  var opens = qsa(box, ".uninOpen");
  for (var i = 0; i < opens.length; i++) {
    (function (btn) {
      btn.onclick = function () {
        dlgHost.innerHTML = uninstallDialogHtml(p, btn.getAttribute("data-mode"));
        wireP24Dialog(dlgHost, p);
      };
    })(opens[i]);

        var exb = await ex.json();
        if (!exb.ok) { el("consoleMsg").innerHTML = '<span class="error">' + esc(exb.error || ex.status) + "</span>"; go.disabled = false; return; }
        el("consoleDlg").innerHTML = '<div class="dlgBox"><div class="dlgTitle">快照恢复完成，重启后生效。</div><div class="uninRow"><button class="uninNo" onclick="this.closest(\'#consoleDlg\').innerHTML=\'\'">关闭</button></div></div>';
        loadSnapshot(); loadStates();
      };
    };
  }
}
function alertOpen(text) {
  var box = el("consoleDlg");
  if (box) box.innerHTML = '<div class="dlgBox"><div class="dlgLine">' + esc(text) + '</div><div class="uninRow"><button class="uninNo" onclick="this.closest(\'#consoleDlg\').innerHTML=\'\'">关闭</button></div></div>';
}

el("refresh").addEventListener("click", loadSnapshot);
el("doctor").addEventListener("click", runDoctor);
loadSnapshot();
loadStates();
</script>
</body>
</html>
