<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-toolkit 面板（插件开关与体检）</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; padding: 20px; background: #111318; color: #e6e6e6; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 16px 0 8px; }
  .muted { color: #9aa0a6; font-size: 12px; }
  .toolbar { display: flex; gap: 8px; margin: 16px 0; align-items: center; flex-wrap: wrap; }
  button { padding: 6px 14px; border-radius: 6px; border: 1px solid #3a3f47; background: #1c2027; color: #e6e6e6; cursor: pointer; font-size: 13px; }
  button:hover { border-color: #5a8dee; }
  button[disabled] { opacity: 0.6; cursor: default; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card { border: 1px solid #2a2f36; border-radius: 8px; padding: 12px; background: #181b21; }
  .card h3 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-family: ui-monospace, Consolas, monospace; }
  .subtitle { font-size: 12.5px; color: #9aa0a6; margin: 0 0 8px; }
  .desc { font-size: 13px; line-height: 1.55; margin: 0 0 10px; color: #d7dae0; }
  .stateRow { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; }
  .dot.on { background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,0.18); }
  .dot.warn { background: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,0.18); }
  .dot.off { background: #8b9099; }
  .state.on { color: #4ade80; }
  .state.warn { color: #fbbf24; }
  .state.off { color: #9aa0a6; }
  .dualBox { margin: 0 0 10px; padding: 8px 10px; border-radius: 6px; background: #2a2210; border: 1px solid #6b5a1e; }
  .dualHead { color: #fbbf24; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .dualLine { font-size: 12px; color: #e0d5b7; line-height: 1.6; }
  .dualCode { font-family: ui-monospace, Consolas, monospace; color: #f0e2b8; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; }
  .derived { background: #3a2b17; color: #e8c36c; }
  .local { background: #211f3a; color: #9c96db; }
  details { margin-top: 10px; border-top: 1px solid #23272d; padding-top: 8px; }
  summary { cursor: pointer; font-size: 12px; color: #8ab4f8; user-select: none; }
  .techRow { font-size: 11.5px; color: #9aa0a6; font-family: ui-monospace, Consolas, monospace; line-height: 1.7; word-break: break-all; }
  .techKey { color: #7f858d; }
  /* ---- P2.2 启停开关（双层分立）---- */
  .toggleBox { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: #151922; border: 1px solid #2a2f36; }
  .toggleHead { font-size: 12px; font-weight: 700; color: #c8cdd4; margin-bottom: 6px; }
  .layerRow { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; line-height: 1.9; margin-bottom: 2px; }
  .layerLabel { color: #8f959d; font-family: ui-monospace, Consolas, monospace; }
  .layerValue { font-weight: 600; }
  .toggleRow { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .confirmBox { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: #1b2028; border: 1px solid #3a4048; }
  .confirmHead { font-size: 12px; font-weight: 700; color: #cfd4da; margin-bottom: 6px; }
  .confirmLine { font-size: 11.5px; color: #9aa0a6; line-height: 1.8; word-break: break-all; }
  .confirmRow { display: flex; gap: 8px; margin-top: 8px; }
  .diffPre { white-space: pre-wrap; background: #12151a; border: 1px solid #2a2f36; border-radius: 4px; padding: 6px 8px; font-size: 11.5px; margin: 6px 0; font-family: ui-monospace, Consolas, monospace; }
  .crossBox { margin-top: 6px; padding: 6px 8px; border-radius: 4px; background: #2a2210; border: 1px solid #6b5a1e; }
  .crossHead { font-size: 11.5px; font-weight: 700; color: #fbbf24; margin-bottom: 3px; }
  .crossLine { font-size: 11px; color: #e0d5b7; font-family: ui-monospace, Consolas, monospace; line-height: 1.7; word-break: break-all; }
  .crossFoot { font-size: 11px; color: #c9bd9a; margin-top: 3px; }
  .errBox { margin-top: 6px; padding: 6px 8px; border-radius: 4px; background: #2b1719; border: 1px solid #6b2226; font-size: 11.5px; color: #f2a6a0; }
  /* 确认页：生效时机说明 + 字段人话解释 */
  .confirmEffect { font-size: 12px; font-weight: 600; color: #fbbf24; line-height: 1.7; margin-bottom: 4px; }
  .confirmNote { font-size: 11.5px; color: #a9aeb5; line-height: 1.75; margin-top: 4px; }
  .noteCode { font-family: ui-monospace, Consolas, monospace; color: #d9c58a; }
  .condNote { margin-top: 4px; font-size: 11px; color: #e0d5b7; line-height: 1.7; }
  /* ---- P2.3 参数编辑 ---- */
  .cfgBox { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: #141a1c; border: 1px solid #24403a; }
  .cfgHead { font-size: 12px; font-weight: 700; color: #9fd8c0; margin-bottom: 4px; }
  .cfgNote { font-size: 11px; color: #8fa89e; line-height: 1.7; margin-bottom: 6px; }
  .cfgSection { font-size: 11px; font-weight: 700; color: #7f8f88; margin: 8px 0 2px; font-family: ui-monospace, Consolas, monospace; }
  .cfgRow { display: flex; gap: 6px; align-items: center; font-size: 11.5px; line-height: 2; flex-wrap: wrap; }
  .cfgLabel { color: #a9b3ad; flex: 1 1 200px; font-family: ui-monospace, Consolas, monospace; }
  .cfgCur { color: #6f7a74; font-family: ui-monospace, Consolas, monospace; }
  .cfgInput { width: 110px; padding: 2px 6px; border-radius: 4px; border: 1px solid #2c3c36; background: #101413; color: #d7e2dc; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  .cfgSave { padding: 2px 8px; border-radius: 4px; border: 1px solid #2c5a4a; background: #12241e; color: #9fd8c0; cursor: pointer; font-size: 11px; }
  .modeBox { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: #161a22; border: 1px solid #2a2f36; }
  .modeLine { font-size: 11.5px; color: #a9aeb5; line-height: 1.8; }
  pre { white-space: pre-wrap; background: #12151a; border: 1px solid #2a2f36; border-radius: 6px; padding: 10px; font-size: 12px; max-height: 340px; overflow: auto; }
  .issues { max-height: 320px; overflow: auto; border: 1px solid #2a2f36; border-radius: 6px; }
  .issue { border-bottom: 1px solid #23272d; padding: 8px; font-size: 12px; line-height: 1.6; }
  .error { color: #f28b82; }
  .warning { color: #e8c36c; }
  .info { color: #9aa0a6; }
  .allGood { padding: 12px 10px; font-size: 13px; color: #67c48b; }
</style>
</head>
<body>
  <h1>dsh-toolkit 面板（插件开关与体检）</h1>
  <div class="muted" id="meta"></div>
  <div class="toolbar">
    <button id="refresh">重新读取状态</button>
    <button id="doctor">一键体检（只查不改）</button>
    <span class="muted" id="doctorStatus"></span>
  </div>
  <div id="cards" class="cards"></div>
  <h2>配置文件原文（cordis.patch.yml · 插件开关所在）</h2>
  <pre id="patch"></pre>
  <h2>体检结果（doctor dry-run · 只查不改）</h2>
  <div id="doctorOut" class="issues"></div>
<script>
var state = null;
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

var DESCRIPTIONS = {
  "agent-memory": "记住你说过的话和项目里的重要信息，下次对话还能用上。",
  "compact-router": "对话变长时自动压缩历史内容，省上下文又不断片。",
  "rate-throttle": "给模型请求限速，避免发得太快被服务方拒绝。",
  "search-router": "决定每次联网搜索走哪条路：官方搜索还是本地搜索。",
  "web-search-local": "提供不依赖官方接口的本地搜索引擎，可自选搜索源。"
};
// 标识符一律「英文原名 + 中文注释」形态：原名是稳定可检索的标识，中文只作注释。
var CN_NAMES = {
  "agent-memory": "记忆",
  "compact-router": "上下文压缩",
  "rate-throttle": "限流",
  "search-router": "搜索路由",
  "web-search-local": "本地网页搜索"
};
// 英文原名：优先用快照里的真实包名尾部，回退到目录名
function originalName(p) {
  var raw = String((p && p.name) || "").trim();
  if (raw) {
    var seg = raw.split("/");
    var last = seg[seg.length - 1];
    if (last) return last;
  }
  return String((p && p.dir) || "");
}
// 「英文原名（中文注释）」单行形态
function annotated(p) {
  var en = originalName(p);
  var cn = CN_NAMES[(p && p.dir) || ""];
  return cn ? en + "（" + cn + "）" : en;
}

function originBadge(p) {
  if (p.origin === "derived") return '<span class="badge derived">第三方衍生 ' + esc(p.upstream) + "</span>";
  return '<span class="badge local">本地原创</span>';
}

// 首选服务端 patchRow.config.enabled —— P2.0 已修 parseRootRows() 的缩进缺陷
// （旧版用不区分缩进的正则收集 config，rate-throttle 自身 enabled:false 会被嵌套
// routing.enabled:true 覆盖成 "true"）。修好后服务端值可信。
// 下面的 rowAnchorFromPatch 仅作防御性回退，避免服务端退回旧解析时误报。
function rowAnchorFromPatch(p, patchText) {
  if (!patchText || !p.patchRow) return null;
  var lines = String(patchText).split(/\r?\n/);
  var wantId = p.patchRow.id;
  var start = -1;
  for (var i = 0; i < lines.length; i++) {
    var m = /^(\s*)- id:\s*([^#\s]+)/.exec(lines[i]);
    if (m && m[2] === wantId) { start = i; break; }
  }
  if (start < 0) return null;
  var cfgIndent = -1;
  for (var j = start + 1; j < lines.length; j++) {
    if (/^(\s*)- id:/.test(lines[j])) break;
    var c = /^(\s+)config:\s*$/.exec(lines[j]);
    if (c) { cfgIndent = c[1].length; break; }
  }
  if (cfgIndent < 0) return null;
  for (var k = start + 1; k < lines.length; k++) {
    if (/^(\s*)- id:/.test(lines[k])) break;
    var kv = /^(\s+)enabled:\s*(\S+)\s*$/.exec(lines[k]);
    if (kv && kv[1].length === cfgIndent + 2) return { value: kv[2] === "true", line: k + 1 };
  }
  return { value: null, line: null };
}
function innerSwitchValue(p, patchText) {
  var row = p.patchRow;
  var cfg = (row && row.config) || {};
  if (row && Object.prototype.hasOwnProperty.call(cfg, "enabled") && typeof cfg.enabled === "string") {
    // 服务端已按缩进解析（P2.0 修复），直接用
    return String(cfg.enabled).trim() === "true";
  }
  // 回退：服务端值缺失时，从 patch 原文按缩进自算
  var exact = rowAnchorFromPatch(p, patchText);
  if (exact) return exact.value;
  return null;
}
var PATCH_TEXT = "";
function stateOf(p) {
  if (p.dir === "compact-router") return { label: "运行中 · 正在生效", cls: "on" };
  if (!p.patchRow) return { label: "配置层停用 · 未加载", cls: "off" };
  // Q1：disabled 是条件写法（如 !!js ...）时，实际是否加载取决于该表达式，
  // 面板不解释，因此不能报"运行中"。
  if (p.patchRow.disabledExpr) return { label: "配置层是条件开关 · 实际是否加载取决于该表达式，面板不解释", cls: "warn" };
  if (p.patchRow.enabled !== true) return { label: "配置层停用 · 未加载", cls: "off" };
  if (innerSwitchValue(p, PATCH_TEXT) === false) return { label: "已加载 · 功能开关关闭，暂不生效", cls: "warn" };
  return { label: "运行中 · 正在生效", cls: "on" };
}
function dualSwitchNotice(p) {
  if (p.patchRow && p.patchRow.enabled === true && innerSwitchValue(p, PATCH_TEXT) === false) {
    return '<div class="dualBox"><div class="dualHead">⚠ 两层开关不一致，所以现在没生效</div>'
      + '<div class="dualLine">第一层（配置文件）：<span class="dualCode">已启用</span> —— 插件已被加载。<br>'
      + '第二层（插件内部）：<span class="dualCode">关闭</span> —— 功能被自己关掉了。<br>'
      + '要让它真正工作，需要把插件配置里的 <span class="dualCode">enabled</span> 改为 <span class="dualCode">true</span>。<br>'
      + '提示：本面板只负责第一层（加载与否）—— 第二层的参数编辑已随 <span class="dualCode">P2.3 配置编辑</span> 上线，见本卡下方<span class="dualCode">「参数编辑」</span>。</div></div>';
  }
  if (p.patchRow && p.patchRow.enabled !== true) {
    return '<div class="dualBox"><div class="dualHead">⚠ 在配置文件中被停用</div>'
      + '<div class="dualLine">插件当前<span class="dualCode">完全没有被加载</span>，相关功能不会工作。'
      + '要恢复需把配置行里的 <span class="dualCode">disabled</span> 去掉或设为 <span class="dualCode">false</span>。<br>'
      + '提示：本卡的启停开关改的就是这一层 —— 直接把开关打开即可恢复。</div></div>';
  }
  return "";
}
function techRow(label, value) {
  return '<div class="techRow"><span class="techKey">' + esc(label) + " : </span>" + esc(value) + "</div>";
}
function techDetails(p) {
  var regs = p.registers || {};
  var list = function (a) { return (a && a.length > 0) ? a.join(", ") : "（无）"; };
  return "<details><summary>技术详情</summary>"
    + techRow("插件目录（dir）", p.dir)
    + techRow("包名（name）", p.name)
    + techRow("managedBy（由谁挂载）", String(p.managedBy))
    + techRow("enabled（配置文件开关）", String(p.enabled))
    + techRow("inject（依赖的服务）", list(p.inject))
    + techRow("services（对外提供的服务）", list(regs.services))
    + techRow("commands（注册的命令）", list(regs.commands))
    + techRow("providers（提供的实现）", list(regs.providers))
    + techRow("events（监听的事件）", list(regs.events))
    + "</details>";
}
function renderCards() {
  var cards = el("cards");
  cards.innerHTML = "";
  if (!state || !Array.isArray(state.plugins)) return;
  for (var i = 0; i < state.plugins.length; i++) {
    var p = state.plugins[i];
    var st = stateOf(p);
    var desc = DESCRIPTIONS[p.dir] || p.note || "（暂无功能说明）";
    var cn = CN_NAMES[p.dir];
    var div = document.createElement("div");
    div.className = "card";
    div.innerHTML = "<h3>" + esc(originalName(p)) + originBadge(p) + "</h3>"
      + (cn ? '<div class="subtitle">' + esc(cn) + "</div>" : "")
      + '<div class="desc">' + esc(desc) + "</div>"
      + '<div class="stateRow"><span class="dot ' + st.cls + '"></span><span class="state ' + st.cls + '">' + esc(st.label) + "</span></div>"
      + dualSwitchNotice(p)
      + toggleHtml(p)
      + (p.dir === "search-router" ? modeHtml(p) : configEditorHtml(p))
      + techDetails(p);
    cards.appendChild(div);
    wireToggle(div, p);
    wireConfig(div, p);
  }
}

// ---- P2.2 启停开关：两层**分立呈现**，绝不合并 ----
// 第一层 patch-row.disabled（可写，走两段式）；第二层 config.enabled（本阶段只读）。
function layerRowHtml(label, valueText, cls) {
  return '<div class="layerRow"><span class="layerLabel">' + esc(label) + '</span>'
    + '<span class="layerValue state ' + cls + '">' + esc(valueText) + "</span></div>";
}
function toggleHtml(p) {
  var row = p.patchRow;
  if (p.dir === "compact-router" || !row) return "";
  var currentEnabled = row.enabled === true;
  var inner = innerSwitchValue(p, PATCH_TEXT);
  // Q1：条件写法（!!js ...）不解释、也不改写 —— 服务端同样会拒绝（双保险）。
  var conditional = !!row.disabledExpr;
  return '<div class="toggleBox" data-toggle-for="' + esc(row.id) + '">'
    + '<div class="toggleHead">启停开关（两层分开，改的是第一层）</div>'
    + layerRowHtml("第一层 · 配置文件（patch-row.disabled）",
        conditional ? "条件开关（面板不解释）" : (currentEnabled ? "已加载" : "未加载（被配置层停用）"),
        conditional ? "warn" : (currentEnabled ? "on" : "off"))
    + layerRowHtml("第二层 · 插件内部（config.enabled）",
        inner === null ? "该插件没有内部开关" : (inner ? "开启" : "关闭"),
        inner === null ? "off" : (inner ? "on" : "warn"))
    + (conditional
        ? '<div class="condNote">这一行的 <span class="noteCode">disabled</span> 是条件写法（<span class="noteCode">'
          + esc(row.disabledExpr) + '</span>）。实际是否加载由该表达式决定，面板不解释、也不会改写它 —— 请手工编辑。</div>'
        : "")
    + '<div class="toggleRow"><button class="tglAsk" data-row="' + esc(row.id) + '" data-next="' + (currentEnabled ? "0" : "1") + '"'
    + (conditional ? " disabled" : "") + ">"
    + (currentEnabled ? "停用（改第一层）" : "启用（改第一层）")
    + "</button><span class=\"muted tglMsg\"></span></div>"
    + '<div class="tglConfirm"></div>'
    + "</div>";
}
function wireToggle(cardEl, p) {
  var box = cardEl.querySelector('[data-toggle-for]');
  if (!box) return;
  var ask = box.querySelector(".tglAsk");
  var msg = box.querySelector(".tglMsg");
  var confirmHost = box.querySelector(".tglConfirm");
  if (!ask) return;
  ask.onclick = async function () {
    var targetEnabled = ask.getAttribute("data-next") === "1";
    ask.disabled = true;
    msg.textContent = "正在生成改动方案…";
    confirmHost.innerHTML = "";
    try {
      var res = await fetch("/api/toolkit-panel/toggle/plan", {
        method: "POST",
        cache: "no-store",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ rowId: p.patchRow.id, enabled: targetEnabled })
      });
      var body = await res.json();
      msg.textContent = "";
      if (!body.ok) { msg.innerHTML = '<span class="error">没能生成方案：' + esc(body.error || res.status) + "</span>"; ask.disabled = false; return; }
      p._plan = body.plan;
      renderConfirm(confirmHost, ask, p);
    } catch (e) {
      msg.innerHTML = '<span class="error">没能生成方案：' + esc(String(e && e.message || e)) + "</span>";
    } finally {
      ask.disabled = false;
    }
  };
}
function renderConfirm(host, askBtn, p) {
  var plan = p._plan;
  if (!plan) return;
  var refs = plan.crossRefs || [];
  var crossHtml = "";
  if (refs.length > 0) {
    crossHtml = '<div class="crossBox"><div class="crossHead">⚠ 有其它配置引用这个插件（共 ' + refs.length + ' 处）</div>';
    for (var i = 0; i < refs.length; i++) {
      crossHtml += '<div class="crossLine">第 ' + refs[i].line + " 行：" + esc(refs[i].text) + "</div>";
    }
    crossHtml += '<div class="crossFoot">停用后这些引用会指向一个未加载的插件。若你确认要停用，请继续。</div></div>';
  }
  host.innerHTML = '<div class="confirmBox">'
    + '<div class="confirmHead">确认后才会写入，下面是具体改动</div>'
    // 生效时机（人话）：改的是配置文件，不影响当前进程
    + '<div class="confirmEffect">'
    + (plan.targetEnabled
        ? "执行后此插件将于下次重启时启用（当前未加载的不会立刻加载）。"
        : "执行后此插件将于下次重启时停用（当前仍运行）。")
    + "</div>"
    + '<div class="confirmLine">目标文件：<span class="dualCode">' + esc(plan.file) + "</span></div>"
    + '<div class="confirmLine">改动位置：第 ' + esc(String(plan.anchorLine)) + " 行的 <span class=\"dualCode\">- id: " + esc(plan.rowId) + "</span></div>"
    + '<pre class="diffPre">' + esc((plan.diff || []).join("\n")) + "</pre>"
    // disabled 字段本身的人话解释（紧挨 diff）
    + '<div class="confirmNote"><span class="noteCode">disabled: true</span> 的意思是：让 DSH 在下次启动时跳过加载这个插件。'
    + "它写在配置文件里，不会影响正在运行的进程 —— 所以要重启才会生效。</div>"
    + crossHtml
    + '<div class="confirmRow"><button class="tglGo">确认写入</button><button class="tglNo">取消</button></div>'
    + "</div>";
  var go = host.querySelector(".tglGo");
  var no = host.querySelector(".tglNo");
  no.onclick = function () { p._plan = null; host.innerHTML = ""; };
  go.onclick = async function () {
    go.disabled = true;
    try {
      var res = await fetch("/api/toolkit-panel/execute", {
        method: "POST",
        cache: "no-store",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token: plan.token })
      });
      var body = await res.json();
      if (!body.ok) {
        host.innerHTML = '<div class="errBox">没能完成：' + esc(body.error || ("HTTP " + res.status)) + "</div>";
        p._plan = null;
        return;
      }
      p._plan = null;
      host.innerHTML = "";
      await loadSnapshot();
    } catch (e) {
      host.innerHTML = '<div class="errBox">没能完成：' + esc(String(e && e.message || e)) + "</div>";
    } finally {
      go.disabled = false;
    }
  };
}
function renderSnapshot(snap) {
  state = snap;
  PATCH_TEXT = (snap.patch && snap.patch.text) || "";
  el("meta").textContent = snap.toolkitName + " " + snap.toolkitVersion + " · 本面板" + (snap.self && snap.self.enabled ? "已启用" : "未启用");
  el("patch").textContent = PATCH_TEXT;
  renderCards();
}

// ---- P2.3 参数编辑（rate-throttle 白名单标量；服务端权威校验，前端仅录入）----
var CONFIG_FIELDS = [
  { path: "enabled", label: "总开关（enabled）", type: "bool", section: "top" },
  { path: "minIntervalMs", label: "两次请求最小间隔（毫秒）", type: "int", section: "top" },
  { path: "maxRequestsPerMinute", label: "每分钟最多请求数", type: "int", section: "top" },
  { path: "adaptive", label: "自动退避（出错后自动放慢）", type: "bool", section: "top" },
  { path: "maxIntervalMs", label: "退避间隔上限（毫秒）", type: "int", section: "top" },
  { path: "backoffFactor", label: "退避放大倍数", type: "num", section: "top" },
  { path: "routing.enabled", label: "自动换源总开关（routing.enabled）", type: "bool", section: "routing" },
  { path: "routing.autoGroups", label: "自动发现模型分组", type: "bool", section: "routing" },
  { path: "routing.autoGroupTtlMs", label: "分组缓存时长（毫秒）", type: "int", section: "routing" },
  { path: "routing.cooldownMs", label: "出错冷却时长（毫秒）", type: "int", section: "routing" },
  { path: "routing.tpmTurnSkip", label: "TPM 超限当轮跳过", type: "bool", section: "routing" },
  { path: "routing.tpmCooldownMs", label: "TPM 短暂除名时长（毫秒，0=关闭）", type: "int", section: "routing" },
  { path: "routing.downgradeContextMargin", label: "降级上下文余量（0.1–1）", type: "num", section: "routing" },
  { path: "routing.maxDowngradeCompactsPerTurn", label: "单轮最多降级压缩次数", type: "int", section: "routing" },
  { path: "routing.metricsWindowMs", label: "指标统计窗口（毫秒）", type: "int", section: "routing" },
  { path: "routing.metricsLogIntervalMs", label: "指标日志间隔（毫秒）", type: "int", section: "routing" },
  { path: "routing.clearCooldownOnUserSwitch", label: "手动切换时清除冷却", type: "bool", section: "routing" },
  { path: "routing.syncSelectionOnFailover", label: "换源后同步选择", type: "bool", section: "routing" }
];
function cfgRawValue(p, f) {
  var panel = p.configPanel || {};
  var v = f.section === "routing"
    ? ((panel.values && panel.values.routing) || {})[f.path.split(".")[1]]
    : (panel.values || {})[f.path];
  return v === undefined || v === null ? "" : String(v).trim();
}
function configEditorHtml(p) {
  var panel = p.configPanel;
  if (!panel || panel.editable !== true) return "";
  var html = '<div class="cfgBox" data-cfg-for="' + esc(panel.rowId) + '">'
    + '<div class="cfgHead">参数编辑（rate-throttle 限流参数 · 改的是配置文件，重启后生效）</div>'
    + '<div class="cfgNote">' + esc(panel.effectNote || "") + "</div>";
  var lastSection = "";
  for (var i = 0; i < CONFIG_FIELDS.length; i++) {
    var f = CONFIG_FIELDS[i];
    if (f.section !== lastSection) {
      lastSection = f.section;
      html += '<div class="cfgSection">' + (f.section === "top" ? "config:（顶层）" : "config.routing:（换源）") + "</div>";
    }
    var cur = cfgRawValue(p, f);
    var input = f.type === "bool"
      ? '<input type="checkbox" class="cfgInput" data-cfg-check="' + esc(f.path) + '"' + (cur === "true" ? " checked" : "") + ">"
      : '<input type="text" class="cfgInput" data-cfg-input="' + esc(f.path) + '" value="' + esc(cur) + '">';
    html += '<div class="cfgRow"><span class="cfgLabel">' + esc(f.label) + "</span>"
      + '<span class="cfgCur">当前 ' + esc(cur) + "</span>" + input
      + '<button class="cfgSave" data-cfg-path="' + esc(f.path) + '" data-cfg-type="' + f.type + '">生成方案</button></div>';
  }
  html += '<div class="cfgConfirm"></div><div class="cfgMsg"></div></div>';
  return html;
}
function modeHtml(p) {
  var panel = p.configPanel;
  if (!panel || !panel.mode) return "";
  return '<div class="modeBox"><div class="cfgHead">搜索路由 mode（当前生效值 · 只读）</div>'
    + '<div class="modeLine">生效值：<span class="dualCode">' + esc(panel.mode.value === null ? "（未设置，走 patch 缺省）" : panel.mode.value)
    + "</span>　来源：<span class=\"dualCode\">" + esc(panel.mode.source) + "</span></div>"
    + '<div class="modeLine">' + esc(panel.note || "") + "</div></div>";
}
function wireConfig(cardEl, p) {
  var box = cardEl.querySelector("[data-cfg-for]");
  if (!box) return;
  var confirmHost = box.querySelector(".cfgConfirm");
  var msg = box.querySelector(".cfgMsg");
  var panel = p.configPanel;
  box.addEventListener("click", async function (ev) {
    var btn = ev.target.closest(".cfgSave");
    if (!btn || btn.disabled) return;
    var path = btn.getAttribute("data-cfg-path");
    var type = btn.getAttribute("data-cfg-type");
    var f = null;
    for (var i = 0; i < CONFIG_FIELDS.length; i++) if (CONFIG_FIELDS[i].path === path) { f = CONFIG_FIELDS[i]; break; }
    if (!f) return;
    var raw;
    if (type === "bool") {
      var cb = box.querySelector('[data-cfg-check="' + path + '"]');
      raw = cb && cb.checked ? "true" : "false";
    } else {
      var inp = box.querySelector('[data-cfg-input="' + path + '"]');
      raw = inp ? inp.value : "";
    }
    var cur = cfgRawValue(p, f);
    if (String(raw).trim() === cur) { msg.innerHTML = '<span class="muted">无改动：已是该值。</span>'; return; }
    btn.disabled = true;
    msg.textContent = "正在生成改动方案…";
    confirmHost.innerHTML = "";
    try {
      var res = await fetch("/api/toolkit-panel/config/plan", {
        method: "POST", cache: "no-store", headers: { "content-type": "application/json" },
        body: JSON.stringify({ rowId: panel.rowId, path: path, value: raw })
      });
      var body = await res.json();
      msg.textContent = "";
      if (!body.ok) { msg.innerHTML = '<span class="error">没能生成方案：' + esc(body.error || res.status) + "</span>"; btn.disabled = false; return; }
      p._cfgPlan = body.plan;
      renderCfgConfirm(confirmHost, btn, p);
    } catch (e) {
      msg.innerHTML = '<span class="error">没能生成方案：' + esc(String(e && e.message || e)) + "</span>";
    }
  });
}
function renderCfgConfirm(host, saveBtn, p) {
  var plan = p._cfgPlan;
  if (!plan) return;
  host.innerHTML = '<div class="confirmBox">'
    + '<div class="confirmHead">确认后才会写入，下面是具体改动</div>'
    + '<div class="confirmEffect">' + esc(plan.effectNote || "") + "</div>"
    + '<div class="confirmLine">目标位置：<span class="dualCode">cordis.patch.yml 第 ' + esc(String(plan.targetLine)) + " 行 · " + esc(plan.rowId) + " → " + esc(plan.path) + "</span></div>"
    + '<pre class="diffPre">' + esc((plan.diff || []).join("\n")) + "</pre>"
    + '<div class="confirmNote">该值由插件在启动时读取（<span class="noteCode">激活快照</span>），没有别的配置来源会盖住它 —— 重启后即按新值运行。</div>'
    + '<div class="confirmRow"><button class="cfgGo">确认写入</button><button class="cfgNo">取消</button></div>'
    + "</div>";
  host.querySelector(".cfgNo").onclick = function () { p._cfgPlan = null; host.innerHTML = ""; saveBtn.disabled = false; };
  host.querySelector(".cfgGo").onclick = async function () {
    var go = host.querySelector(".cfgGo");
    go.disabled = true;
    try {
      var res = await fetch("/api/toolkit-panel/execute", {
        method: "POST", cache: "no-store", headers: { "content-type": "application/json" },
        body: JSON.stringify({ token: plan.token })
      });
      var body = await res.json();
      if (!body.ok) {
        host.innerHTML = '<div class="errBox">没能完成：' + esc(body.error || ("HTTP " + res.status)) + "</div>";
        p._cfgPlan = null;
        return;
      }
      p._cfgPlan = null;
      host.innerHTML = "";
      await loadSnapshot();
    } catch (e) {
      host.innerHTML = '<div class="errBox">没能完成：' + esc(String(e && e.message || e)) + "</div>";
    }
  };
}
async function loadSnapshot() {
  var res = await fetch("/api/toolkit-panel/snapshot", { cache: "no-store" });
  if (res.status === 403) { el("meta").textContent = "拒绝访问：本页面只允许在这台电脑上打开。"; return; }
  var body = await res.json();
  if (body.ok) renderSnapshot(body.snapshot);
  else el("meta").textContent = "读取失败：" + (body.error || res.status);
}

var SEVERITY_TEXT = { error: "必须修", warning: "建议修", info: "提示" };
function severityText(sev) { return SEVERITY_TEXT[sev] || String(sev); }
async function runDoctor() {
  var btn = el("doctor");
  btn.disabled = true;
  el("doctorStatus").textContent = "正在体检…";
  var out = el("doctorOut");
  out.innerHTML = "";
  try {
    var res = await fetch("/api/toolkit-panel/doctor/dry-run", { method: "POST", cache: "no-store" });
    var body = await res.json();
    if (!body.ok) {
      el("doctorStatus").textContent = "体检没能完成";
      out.innerHTML = '<div class="issue error">' + esc(body.error || res.status) + "</div>";
      return;
    }
    var r = body.report || {};
    var s = r.summary || {};
    var nErr = s.error || 0;
    var nWarn = s.warning || 0;
    var nInfo = s.info || 0;
    el("doctorStatus").textContent = (nErr === 0 && nWarn === 0)
      ? ("体检完成：一切正常" + (nInfo > 0 ? "（另有 " + nInfo + " 条提示）" : ""))
      : ("体检完成：发现 " + (nErr > 0 ? nErr + " 个必须修的问题" : "") + (nErr > 0 && nWarn > 0 ? "、" : "") + (nWarn > 0 ? nWarn + " 个建议修的问题" : ""));
    var items = r.issues || [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var div = document.createElement("div");
      div.className = "issue " + it.severity;
      div.innerHTML = "<b>" + esc(severityText(it.severity)) + "</b>：" + esc(it.message)
        + '<div class="techRow">' + esc(it.id) + " · " + esc(it.file) + ":" + esc(it.line) + "</div>";
      out.appendChild(div);
    }
    if (items.length === 0) out.innerHTML = '<div class="allGood">✓ 没有发现任何问题，配置是健康的。</div>';
  } finally {
    btn.disabled = false;
  }
}
el("refresh").addEventListener("click", loadSnapshot);
el("doctor").addEventListener("click", runDoctor);
loadSnapshot();
</script>
