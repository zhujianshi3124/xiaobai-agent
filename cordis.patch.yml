# xiaobai-agent 总装补丁：一个 bundle 层替代五个旧插件的 patch 层。
# 开源 S1 剔除批（C1-007 G1/G3，2026-09-30）：web-search-local 行与 web.fetchProvider 已随
# MIT 外来件剔除；search-router 保留为路由骨架，本地搜索位（local-multi）可缺席（缺席回落官方）。
# 开源 S2.e（C1-007 案②，2026-10-01）：本文件为**模板形**——两处机器绝对路径改为占位符，
# 部署时填空：<AGENT_MEMORY_DATA_ROOT>＝agent-memory 数据根（目录路径）；
# <PANEL_ENTRY_URL>＝面板入口的 file:// URL（指向本包 panel/index.js）。
# debt-039-a 施工笔（EXE-BOOT-045）：bundle 通道另配**零占位符**的 bundle.patch.yml
# （package.json dsh.bundle.patch 声明之，缺省语义见该文件头）；本模板维持部署期填空形态不变。
# compact-router 不在此：由 scripts/apply-preset-patch.mjs 改写预设 compaction 行名。

- id: web
  config: {}

- id: web-search-deepseek
  disabled: false

- insert:
    - id: rate-throttle
      name: 'xiaobai-agent/rate-throttle'
      config:
        enabled: false
        throttleProviders: []
        minIntervalMs: 3000
        maxRequestsPerMinute: 6
        adaptive: false
        maxIntervalMs: 20000
        backoffFactor: 2
        logProviders: []
        logPath: ''
        routing:
          enabled: true
          autoGroups: true
          autoGroupTtlMs: 300000
          excludeProviders: [llm-deepseek, deepseek-official]
          cooldownMs: 300000
          tpmTurnSkip: true
          tpmCooldownMs: 45000
          downgradeContextMargin: 0.9
          maxDowngradeCompactsPerTurn: 1
          metricsWindowMs: 600000
          metricsLogIntervalMs: 60000
          clearCooldownOnUserSwitch: true
          syncSelectionOnFailover: true
          staticGroups:
            - id: example-group-a
              providers:
                - { provider: example-provider-a, model: example-model-a }
                - { provider: example-provider-b, model: example-model-a }
                - { provider: example-provider-c, model: example-model-a }
                - { provider: example-provider-d, model: example-model-a }
                - { provider: example-provider-e, model: example-model-a }
            - id: example-group-b
              providers:
                - { provider: example-provider-f, model: example-model-b }
                - { provider: example-provider-g, model: example-model-b }
                - { provider: example-provider-h, model: example-model-b }
                - { provider: example-provider-i, model: example-model-b }
                - { provider: example-provider-j, model: example-model-b }
                - { provider: example-provider-k, model: example-model-b }
      inject: [llm, tokenMeter]

- insert:
    - id: agent-memory-runtime
      name: 'xiaobai-agent/agent-memory/plugin'
      config:
        dataRoot: <AGENT_MEMORY_DATA_ROOT>
        defaultWorkspace: null
      inject: [systemPrompt]

- insert:
    - id: agent-model-follow
      name: 'xiaobai-agent/agent-model-follow'
      inject: [agents]

- insert:
    - id: toolkit-manager
      name: '<PANEL_ENTRY_URL>'

- insert:
    - id: governance-preflight
      name: 'xiaobai-agent/governance-preflight'
      config:
        enabled: true
        reportRoot: ''
      inject: []

- insert:
    - id: governance-context-audit
      name: 'xiaobai-agent/governance-context-audit'
      config:
        enabled: true
        reportRoot: ''
        usageLedgerPath: ''
      inject: []

- insert:
    - id: governance-overlap-detect
      name: 'xiaobai-agent/governance-overlap-detect'
      config:
        enabled: true
        reportRoot: ''
        similarityThreshold: 0.6
      inject: []

- insert:
    - id: governance-usage-track
      name: 'xiaobai-agent/governance-usage-track'
      config:
        enabled: true
        reportRoot: ''
        usageLedgerPath: ''
        zombieDays: 14
        highFreqCalls: 500
        midFreqCalls: 50
        writeHistory: true
      inject: []

- insert:
    - id: governance-tiering
      name: 'xiaobai-agent/governance-tiering'
      config:
        enabled: true
        reportRoot: ''
        writeHistory: true
      inject: []

- insert:
    - id: governance-router
      name: 'xiaobai-agent/governance-router'
      config:
        enabled: true
        reportRoot: ''
        rules: []
        maxInjectPerTurn: 1
        dedupeScope: session
      inject: []

- insert:
    - id: governance-cleanup
      name: 'xiaobai-agent/governance-cleanup'
      config:
        enabled: true
        reportRoot: ''
        writeHistory: true
      inject: []

- insert:
    - id: governance-output-gate
      name: 'xiaobai-agent/governance-output-gate'
      inject: [commands, sessions]
