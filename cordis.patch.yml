# dsh-toolkit 总装补丁：一个 bundle 层替代五个旧插件的 patch 层。
# 开源 S1 剔除批（C1-007 G1/G3，2026-09-30）：web-search-local 行与 web.fetchProvider 已随
# MIT 外来件剔除；search-router 保留为路由骨架，本地搜索位（local-multi）可缺席（缺席回落官方）。
# compact-router 不在此：由 scripts/apply-preset-patch.mjs 改写预设 compaction 行名。

- id: web
  config:
    searchProvider: auto-search

- id: web-search-deepseek
  disabled: false

- insert:
    - id: rate-throttle
      name: 'dsh-toolkit/rate-throttle'
      config:
        enabled: false
        throttleProviders: []
        minIntervalMs: 3000
        maxRequestsPerMinute: 6
        adaptive: false
        maxIntervalMs: 20000
        backoffFactor: 2
        logProviders: []
        logPath: ''
        routing:
          enabled: true
          autoGroups: true
          autoGroupTtlMs: 300000
          excludeProviders: [llm-deepseek, deepseek-official]
          cooldownMs: 300000
          tpmTurnSkip: true
          tpmCooldownMs: 45000
          downgradeContextMargin: 0.9
          maxDowngradeCompactsPerTurn: 1
          metricsWindowMs: 600000
          metricsLogIntervalMs: 60000
          clearCooldownOnUserSwitch: true
          syncSelectionOnFailover: true
          staticGroups:
            - id: v4-pro
              providers:
                - { provider: sensenova-gateway, model: deepseek-v4-pro }
                - { provider: sensenova-gateway-2, model: deepseek-v4-pro }
                - { provider: nvidia, model: deepseek-ai/deepseek-v4-pro-0813 }
                - { provider: modelscope-gateway, model: deepseek-ai/DeepSeek-V4-Pro-0813 }
                - { provider: modelscope-gateway-2, model: deepseek-ai/DeepSeek-V4-Pro-0813 }
            - id: v4-flash
              providers:
                - { provider: sensenova-gateway, model: deepseek-v4-flash }
                - { provider: sensenova-gateway-2, model: deepseek-v4-flash }
                - { provider: amd-gateway, model: DeepSeek-V4-Flash }
                - { provider: nvidia, model: deepseek-ai/deepseek-v4-flash-0731 }
                - { provider: modelscope-gateway, model: deepseek-ai/DeepSeek-V4-Flash-0731 }
                - { provider: modelscope-gateway-2, model: deepseek-ai/DeepSeek-V4-Flash-0731 }
      inject: [llm, tokenMeter]

- insert:
    - id: web-search-router
      name: 'dsh-toolkit/search-router'
      config:
        mode: auto
        officialProviders: [llm-deepseek]
        officialProviderPatterns: []
        officialModelPatterns: []
        defaultWhenUnknown: local
      inject: [web]

- insert:
    - id: agent-memory-runtime
      name: 'dsh-toolkit/agent-memory/plugin'
      config:
        dataRoot: C:\Users\LENOVO\.agent-memory
        defaultWorkspace: null
      inject: [systemPrompt]

- insert:
    - id: toolkit-manager
      name: 'file:///D:/dsh-plugins/dsh-toolkit/panel/index.js'
