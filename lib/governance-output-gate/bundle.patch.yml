# governance-output-gate bundle 补丁（形态照 governance-router / governance-cleanup 样板）。
#
# 与 lib/rate-throttle、lib/agent-memory、lib/governance-preflight、
# lib/governance-context-audit、lib/governance-overlap-detect、lib/governance-usage-track、
# lib/governance-tiering、lib/governance-router、lib/governance-cleanup 同族：本子包自带一条
# insert 行，由仓根 package.json 的 dsh.bundle.patch 数组按序拼接（批次 1 地基）。
#
# 本行不写 disabled（默认挂载）。闸门的开关态由 ~/.dsh/output-gate.json 决定（缺省 OFF），
# 本行不带 config：入口不读 config，开关只归用户命令 /gate on|off。
# inject 与入口 lib/index.js 的 `export const inject` 逐字一致（commands / sessions）。
- insert:
    - id: governance-output-gate
      name: 'xiaobai-agent/governance-output-gate'
      inject: [commands, sessions]
